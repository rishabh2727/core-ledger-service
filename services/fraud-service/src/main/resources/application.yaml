spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/fraud
    username: postgres
    password: devpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-service-group
      # this decides what happens the first time this consumer group ever connects
      auto-offset-reset: earliest

server:
  port: 8081
  # Ledger Service runs on port 8080
# they can't both use 8080