spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fraud}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:devpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:fraud-service-group}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8081}